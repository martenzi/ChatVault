[project]
name = "chatvault"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "jinja2>=3.1",
  "orjson>=3.10",
  "python-dateutil>=2.9",
  "neo4j>=5.23",
  "questionary>=2.0",
  "textual>=0.60",
  "pyyaml>=6.0",
  "sqlite-vec>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]
# Semantic search (chatvault.embeddings) does NOT depend on sentence-
# transformers: this machine's Python 3.14 + Intel macOS combination has no
# installable torch or onnxruntime wheel at all (a real ecosystem gap, not a
# preference), so embeddings are generated via a local Ollama server
# (nomic-embed-text) over HTTP instead — no extra Python package needed
# beyond sqlite-vec (now a hard dependency above, since db.connect() loads
# it unconditionally for the conv_embeddings virtual table). Ollama itself
# is a separate local binary, not something pip/uv can express as a
# dependency — see STATUS.md's Semantic Search section for setup.

[project.scripts]
chatvault = "chatvault.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatvault"]
